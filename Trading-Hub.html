<style>
:root{--bg:#0a0e1a;--card:#111827;--border:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--green:#10b981;--blue:#3b82f6;--yellow:#f59e0b;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);padding:18px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:11px}
.tab.active{background:var(--blue);border-color:var(--blue);color:white}
.tab.lme-tab.active{background:#f59e0b;border-color:#f59e0b;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.card h3{font-size:11px;margin-bottom:8px;color:var(--muted);text-transform:uppercase}
.row{display:flex;gap:8px;margin-bottom:8px}
.input-group{flex:1}
.input-group label{font-size:9px;color:var(--muted);display:block;margin-bottom:2px;text-transform:uppercase}
input,select,textarea{width:100%;padding:8px 9px;background:#0f172a;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.auto-box{background:#0f172a;border:1px dashed #334155;border-radius:6px;padding:8px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.auto-box .label{font-size:10px;color:var(--muted)} .auto-box .val{font-size:14px;font-weight:800}
.profit{color:var(--green)}
.btn{padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:11px}
.btn-primary{background:var(--blue);color:white}.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-green{background:var(--green);color:#000}.btn-yellow{background:var(--yellow);color:#000}
.table{width:100%;border-collapse:collapse;font-size:11px}.table th{color:var(--muted);font-size:9px;text-transform:uppercase;padding:5px;border-bottom:1px solid var(--border);text-align:left}.table td{padding:7px 5px;border-bottom:1px solid #111827}.table tr:hover{background:rgba(59,130,246,0.1)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px}.kpi-card .l{font-size:9px;color:var(--muted);text-transform:uppercase}.kpi-card .v{font-size:13px;font-weight:800;margin-top:2px}
.hidden{display:none}
.price-up{color:var(--green)} .price-down{color:var(--red)}

.lme-item{background:#0f172a;border:1px solid #1f2937;border-radius:8px;padding:10px}
